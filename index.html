<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Amour Jewels</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231A1712'/%3E%3Ctext x='32' y='44' font-family='Fraunces,Georgia,serif' font-size='34' fill='%23FFFFFF' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="second.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-atelier.css?v=20260923">
<link rel="icon" type="image/x-icon" href="favicon.png">
</head>
<body class="adm-body">

<!-- ——— LOGIN (real backend sign-in) ——— -->
<div class="adm-login" id="admLogin">
  <div class="bento">
    <div style="text-align:center;margin-bottom:24px">
      <div class="f-logo">AMOUR</div>
      <span style="font:500 9px/1 var(--sans);letter-spacing:.4em;text-transform:uppercase;color:var(--gold-deep)">Admin Console</span>
    </div>
    <div id="admStep1">
      <div class="field"><label>E-mail</label><input id="admUser" type="email" autocomplete="username" placeholder="you@amourjewels.in" spellcheck="false"></div>
      <div class="field"><label>Password</label>
        <div class="adm-pass-wrap">
          <input id="admPass" type="password" autocomplete="current-password" placeholder="········">
          <button type="button" id="admPassEye" aria-label="Show password" title="Show password">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.2 10-6.2S22 12 22 12s-3.6 6.2-10 6.2S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn wide" id="admLoginBtn" style="width:100%">Sign In</button>
      <p class="adm-err" id="admErr"></p>
      <p class="adm-note">Authorised staff only. Repeated wrong passwords lock the account for a while.</p>
    </div>
    <p class="adm-secure"><b>Secure sign-in.</b> Your session ends automatically after 2 hours and when you close this tab.</p>
  </div>
</div>

<!-- ——— PANEL ——— -->
<div class="adm-shell" id="admShell" hidden>
  <aside class="adm-side">
    <div class="brand">
      <div class="f-logo">AMOUR</div>
      <span>Admin Console</span>
    </div>
    <nav class="adm-nav" id="admNav">
      <button data-sec="dash" class="active">Dashboard</button>
      <button data-sec="orders">Orders</button>
      <button data-sec="products">Products</button>
      <button data-sec="categories">Categories</button>
      <button data-sec="inventory">Inventory</button>
      <button data-sec="customers">Customers</button>
      <button data-sec="reviews">Reviews</button>
      <button data-sec="returns">Returns &amp; Refunds</button>
      <button data-sec="coupons">Coupons</button>
      <button data-sec="messages">Messages</button>
      <button data-sec="shipping">Shipping</button>
      <button data-sec="gst">GST &amp; Invoicing</button>
      <button data-sec="emails">Email Queue</button>
    </nav>
    <div class="adm-foot">
      <p>Amour Jewels<br>Admin Console</p>
      <p id="admSession" style="margin-top:8px;opacity:.75">Session: —</p>
      <button class="adm-btn" id="admLogout" style="margin-top:10px;width:100%">Sign out</button>
    </div>
  </aside>

  <main class="adm-main">
    <div class="adm-top">
      <h1 id="admTitle">Dashboard</h1>
      <div class="who"><span class="adm-ava" id="admAva">A</span><span id="admWho">Not signed in</span></div>
    </div>

    <section class="adm-sec active" data-sec="dash"></section>
    <section class="adm-sec" data-sec="orders"></section>
    <section class="adm-sec" data-sec="products"></section>
    <section class="adm-sec" data-sec="categories"></section>
    <section class="adm-sec" data-sec="inventory"></section>
    <section class="adm-sec" data-sec="customers"></section>
    <section class="adm-sec" data-sec="reviews"></section>
    <section class="adm-sec" data-sec="returns"></section>
    <section class="adm-sec" data-sec="coupons"></section>
    <section class="adm-sec" data-sec="messages"></section>
    <section class="adm-sec" data-sec="shipping"></section>
    <section class="adm-sec" data-sec="gst"></section>
    <section class="adm-sec" data-sec="emails"></section>
  </main>
</div>

<script src="config.js"></script>
<script src="main.js?v=20261106" defer></script>
</body>
</html>
